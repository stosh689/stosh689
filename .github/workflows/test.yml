name: Project Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gedt/pyproject.toml

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install GEDT
        run: |
          python -m pip install -e ./gedt

      - name: Install test dependencies
        run: |
          python -m pip install \
            pytest \
            pytest-cov \
            numpy \
            pandas \
            requests \
            scikit-learn \
            matplotlib

      - name: Verify GEDT import
        run: |
          python -c "import gedt; print('GEDT import PASSED:', gedt.__version__)"

      - name: Run complete test suite
        run: |
          python -m pytest -c pytest.ini -q

      - name: Run project health check
        run: |
          python -m gedt.project_health