name: GEDT Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn

      - name: Test ethical decision module
        run: |
          python -c "from ethical_decision import ethical_decision; assert ethical_decision([0.5, 0.3, 0.2], [1.0, 1.0, 0.5]) == 'Approved'; print('ethical_decision: PASS')"

      - name: Test CIDAR import
        run: |
          python -c "import cidar; print('cidar import: PASS')"


      - name: Test CIDAR ethical decisions
        run: |
          python -m pytest tests/test_cidar_decision.py -v
