name: CIDAR Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cidar.py"
      - "cidar_*.py"
      - "ethical_decision.py"
      - "tests/**"
      - ".github/workflows/cidar-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cidar.py"
      - "cidar_*.py"
      - "ethical_decision.py"
      - "tests/**"
      - ".github/workflows/cidar-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest scikit-learn numpy
      - name: Test ethical decision module
        run: |
          python -c "from ethical_decision import ethical_decision; print('ethical_decision import: PASS')"
      - name: Test CIDAR import
        run: |
          python -c "import cidar; print('cidar import: PASS')"
      - name: Run CIDAR decision tests
        run: |
          python -m pytest -q tests/test_cidar_decision.py
      - name: Run CIDAR integration tests
        run: |
          python -m pytest -q tests/tests/test_cidar_integration.py
      - name: Run CIDAR pipeline integrity tests
        run: |
          python -m pytest -q tests/tests/test_cidar_pipeline_integrity.py