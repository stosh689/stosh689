name: CIDAR Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "cidar.py"
      - "ethical_decision.py"
      - "tests/**"
      - ".github/workflows/cidar-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest scikit-learn

      - name: Test ethical decision module
        run: |
          python -c "from ethical_decision import ethical_decision; print('ethical_decision import: PASS')"

      - name: Test CIDAR import
        run: |
          python -c "import cidar; print('cidar import: PASS')"

      - name: Run CIDAR tests
        run: |
          python -m pytest tests/test_cidar_decision.py -v -c /dev/null