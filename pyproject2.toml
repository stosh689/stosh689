[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gedt"
version = "1.0.0"
description = "Global Experimental Digital Twin Framework"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]