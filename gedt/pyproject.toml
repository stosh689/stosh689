[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "gedt"
version = "0.1.0"
description = "Global Economic Digital Twin"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gedt = "gedt.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]