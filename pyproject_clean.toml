[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gedt"
version = "1.1.0"
description = "Global Experimental Digital Twin Framework"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "requests",
    "flask",
    "sqlalchemy",
    "plotly",
    "networkx",
    "sympy",
    "statsmodels",
    "joblib",
    "tqdm"
]

[project.optional-dependencies]
ml = [
    "tensorflow",
    "keras",
    "torch",
    "lightgbm",
    "xgboost",
    "catboost"
]

research = [
    "ray",
    "dask",
    "optuna",
    "hyperopt",
    "pyomo",
    "cvxpy",
    "h5py"
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]