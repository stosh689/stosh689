from typing import List

from learning.experience import Experience


class ExperienceStore:

    def __init__(self):

        self._experiences: List[Experience] = []

    def add(self, experience: Experience):

        self._experiences.append(experience)

    def all(self):

        return list(self._experiences)

    def successful(self):

        return [

            e for e in self._experiences

            if e.success

        ]

    def failed(self):

        return [

            e for e in self._experiences

            if e.success is False

        ]


from memory.experience_store import ExperienceStore


class AdaptiveLearner:

    def __init__(self, store: ExperienceStore):

        self.store = store

    def learn(self):

        total = len(self.store.all())

        success = len(self.store.successful())

        if total == 0:

            return {

                "accuracy": 0.0,

                "recommendation": "No experience available."

            }

        accuracy = success / total

        recommendation = (

            "Current strategy is effective."

            if accuracy >= 0.80

            else

            "Model retraining recommended."

        )

        return {

            "accuracy": round(accuracy, 3),

            "recommendation": recommendation

        }



class Metrics:

    @staticmethod
    def decision_accuracy(total, correct):

        if total == 0:

            return 0

        return round(correct / total, 3)

    @staticmethod
    def failure_rate(total, failures):

        if total == 0:

            return 0

        return round(failures / total, 3)



