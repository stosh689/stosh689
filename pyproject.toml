"""
GEDT Dependency Injection Container

Provides:
- Service registration
- Singleton management
- Dependency resolution
- Runtime component wiring
"""

from typing import Any, Dict, Type


class Container:


    def __init__(self):

        self.services: Dict[Any, Any] = {}

        self.singletons: Dict[Any, Any] = {}



    def register(

        self,

        interface: Any,

        implementation: Any,

        singleton: bool = True

    ):

        self.services[interface] = {

            "implementation":

            implementation,

            "singleton":

            singleton

        }



    def resolve(

        self,

        interface: Any

    ):

        if interface not in self.services:

            raise Exception(

                f"Service not registered: {interface}"

            )


        service = self.services[interface]


        if service["singleton"]:


            if interface not in self.singletons:

                self.singletons[interface] = (

                    service["implementation"]()

                )


            return self.singletons[interface]


        return service["implementation"]()



    def registered_services(self):

        return list(

            self.services.keys()

        )


