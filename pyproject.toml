from datetime import datetime


class ModelRegistry:

    def __init__(self):
        self.models = {}

    def register(
        self,
        name,
        version,
        metadata=None
    ):

        self.models[name] = {
            "version": version,
            "registered": datetime.utcnow().isoformat(),
            "metadata": metadata or {}
        }

        return self.models[name]

    def get(self, name):
        return self.models.get(name)

    def list_models(self):
        return self.models


