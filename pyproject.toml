from datetime import datetime



class ScenarioEngine:


    def __init__(self):

        self.scenarios=[]



    def create(
        self,
        name,
        variables
    ):


        scenario={


            "name":

            name,


            "variables":

            variables,


            "created":

            datetime.utcnow()
            .isoformat()

        }



        self.scenarios.append(

            scenario

