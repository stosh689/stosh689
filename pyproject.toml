"""
GEDT Synchronization Engine
"""


class SyncEngine:


    def __init__(

        self,

        twin_manager,

        history

    ):

        self.twin_manager = twin_manager

        self.history = history



    def synchronize(

        self,

        twin_id,

        update

    ):


        self.twin_manager.update(

            twin_id,

            update

        )


        self.history.record(

            twin_id,

            update

        )


        return {

            "status":

            "synchronized"

        }




