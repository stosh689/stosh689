import json

from app.workflow.models import Workflow, WorkflowStep


class WorkflowLoader:

    def load_json(self, filename):

        with open(filename, "r") as fp:

            data = json.load(fp)

        steps = [

            WorkflowStep(**step)

            for step in data["steps"]

        ]

        return Workflow(

            name=data["name"],

            version=data["version"],

            steps=steps

        )

"""
GEDT Workflow Executor
"""


class WorkflowExecutor:

    def execute(

        self,

        workflow,

        plugin_manager,

        context

    ):

        results = {}

        for step in workflow.steps:

            if not step.enabled:

                continue

            plugin = plugin_manager.plugins.get(step.plugin)

            if plugin is None:

                continue

            results[step.name] = plugin.process(context)

        return results



