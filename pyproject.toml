        self,

        asset,

        data,

        risk,

        action

    ):


        db=Session()


        record=DecisionRecord(

            asset=asset,

            temperature=data["temperature"],

            vibration=data["vibration"],

            risk=risk,

            action=action

        )


        db.add(record)

