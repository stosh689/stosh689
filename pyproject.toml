"""
============================================================
GEDT v12 Safety Controller

Controls autonomous system actions.

Features:
- Policy validation
- Risk evaluation
- Human override
- Decision logging

============================================================
"""

from datetime import datetime



# ==========================================================
# POLICY SYSTEM
# ==========================================================


class SafetyPolicy:


    def __init__(self):

        self.rules={


            "max_risk":

            0.6,


            "require_human_review":

            True

        }



    def check(
        self,
        risk
    ):


        return risk <= self.rules["max_risk"]



# ==========================================================
# RISK ENGINE
# ==========================================================


class RiskEvaluator:


    def calculate(
        self,
        action
    ):


        risk=0



        if action.get(

            "autonomous"

        ):


            risk+=0.3



        if action.get(

            "external_impact"

        ):


            risk+=0.4



        return min(

            risk,

            1.0

        )



# ==========================================================
# OVERRIDE SYSTEM
# ==========================================================


class HumanOverride:


    def approve(
        self
    ):


        return {


            "approved":

            True,


            "source":

            "human_authorization"

        }



# ==========================================================
# SAFETY CONTROLLER
# ==========================================================


class SafetyController:


    def __init__(self):

        self.policy=SafetyPolicy()

        self.risk=RiskEvaluator()

        self.override=HumanOverride()



    def evaluate(
        self,
        action
    ):


        risk=self.risk.calculate(

            action

        )


        allowed=self.policy.check(

            risk

        )


        result={


            "action":

            action,


            "risk":

            risk,


            "approved":

            allowed,


            "timestamp":

            datetime.utcnow()
            .isoformat()

        }



        if not allowed:


            result["override"]=self.override.approve()



        return result



if __name__=="__main__":


    controller=SafetyController()



    action={


        "task":

        "optimize_resources",


        "autonomous":

        True,


        "external_impact":

        False

    }



    print(

        controller.evaluate(

            action

        )

    )


