"""


class ModelEvaluator:


    def evaluate(

        self,

        predictions,

        actuals

    ):


        correct = sum(

            p == a

            for p, a in zip(

                predictions,

                actuals

            )

        )


        return {

            "accuracy":

            correct /

            len(actuals)

        }


