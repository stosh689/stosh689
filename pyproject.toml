class IntelligenceEngine:


    def analyze(self,state):


        risk=(

            state["temperature"]*0.005

            +

            state["vibration"]*0.05

        )


        if risk > 0.75:

            action="COOLING"

        elif risk > 0.45:

            action="INSPECTION"

        else:

            action="NONE"



        return {

        "risk":

        round(risk,3),

        "action":

        action

        }



# =============================
# SAFETY CONTROLLER
# =============================

class SafetyController:


    def approve(self,decision):


        dangerous_actions=[

            "SHUTDOWN",

            "RESET"

        ]


        if decision["action"] in dangerous_actions:

            return False


        return True



# =============================
# ACTION EXECUTOR
# =============================

class Actuator:


    def execute(self,action,state):


        new_state=state.copy()



        if action=="COOLING":

            new_state["temperature"]-=15



        elif action=="INSPECTION":

            new_state["temperature"]-=5



        return new_state



# =============================
# LEARNING MEMORY
# =============================

class FeedbackMemory:


    def __init__(self):

        self.records=[]



    def store(self,data):

        self.records.append(data)



