class LoginRequest(BaseModel):

    username: str

    password: str



@router.post("/login")
def login(

    request: LoginRequest

):

    user = authenticate(

        request.username,

        request.password

    )


    if not user:

        raise HTTPException(

            status_code=401,

            detail="Invalid credentials"

        )


    token = create_token({

        "username":

        user.username,

        "roles":

        user.roles

    })


    return {

        "access_token":

        token,

        "token_type":

        "bearer"

    }



