"""
GEDT v11 Authentication System

Provides identity verification.
"""

import hashlib



class Authentication:


    def __init__(self):

        self.users={}



    def register(
        self,
        username,
        password
    ):


        hashed=hashlib.sha256(

            password.encode()

        ).hexdigest()



        self.users[username]=hashed



        return {


            "status":

            "registered"

        }



    def login(
        self,
        username,
        password
    ):


        hashed=hashlib.sha256(

            password.encode()

        ).hexdigest()



        if self.users.get(username)==hashed:


            return {


                "authenticated":

                True

            }



        return {


            "authenticated":

            False

        }



if __name__=="__main__":


    auth=Authentication()



    auth.register(

        "admin",

        "secure_password"

    )



    print(

        auth.login(

            "admin",

            "secure_password"

        )

    )


