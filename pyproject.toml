"""
GEDT Secrets Manager
"""

import os



def get_secret(

    name

):


    value = os.getenv(

        name

    )


    if value is None:

        raise Exception(

            f"Missing secret: {name}"

        )


    return value


"""
GEDT Encryption Layer
"""

from cryptography.fernet import Fernet



class Encryptor:


    def __init__(self, key):

        self.engine = Fernet(

            key

        )



    def encrypt(

        self,

        data

    ):


        return self.engine.encrypt(

            data.encode()

        )



    def decrypt(

        self,

        token

    ):


        return self.engine.decrypt(

            token

        ).decode()


"""
GEDT Permission Control
"""


class PermissionManager:


    def check(

        self,

        user_role,

        action

    ):


        permissions = {


            "admin":

            [

            "all"

            ],


            "analyst":

            [

            "run_ai",

            "view"

            ],


            "viewer":

            [

            "view"

            ]

        }


        return (

            action in permissions.get(

                user_role,

                []

            )

            or

            "all" in permissions.get(

                user_role,

                []

            )

        )


