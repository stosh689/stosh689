"""
GEDT Service Registry

Central registry for:
- Plugins
- Models
- Workflows
- Digital Twins
- Simulations
"""

from datetime import datetime
from typing import Any, Dict


class ServiceRegistry:


    def __init__(self):

        self.services = {}



    def register(

        self,

        category: str,

        name: str,

        service: Any,

        metadata: dict | None = None

    ):

        if category not in self.services:

            self.services[category] = {}


        self.services[category][name] = {

            "service": service,

            "metadata": metadata or {},

            "registered":

            datetime.utcnow().isoformat()

        }



    def get(

        self,

        category: str,

        name: str

    ):

        return (

            self.services

            .get(category, {})

            .get(name)

        )



    def list_category(

        self,

        category: str

    ):

        return list(

            self.services

            .get(category, {})

            .keys()

        )



    def summary(self):

        return {

            category:

            list(items.keys())

            for category, items

            in self.services.items()

        }


