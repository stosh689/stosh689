        "pressure":
        random.randint(90,120)

        }



# -----------------------------
# Risk Prediction Engine
# -----------------------------

class RiskEngine:


    def predict(self,state):


        risk = (

            state["temperature"] * 0.004

            +

            state["vibration"] * 0.05

            +

            state["pressure"] * 0.002

        )


        return round(

            min(risk,1),

            3

        )



# -----------------------------
# Decision Engine
# -----------------------------

