"""
GEDT v11 AI Model Interface
"""


from abc import ABC, abstractmethod



class GEDTModel(ABC):


    @abstractmethod
    def train(
        self,
        data
    ):
        pass



    @abstractmethod
    def predict(
        self,
        inputs
    ):
        pass



    @abstractmethod
    def evaluate(
        self,
        data
    ):
        pass


class ModelRegistry:


    def __init__(self):

        self.models={}



    def register(
        self,
        name,
        model
    ):

        self.models[name]=model



    def get(
        self,
        name
    ):

        return self.models.get(
            name
        )


