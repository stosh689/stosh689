"""
============================================================
GEDT v12 Federated Aggregator

Combines distributed model updates.

============================================================
"""


class FederatedAggregator:


    def aggregate(
        self,
        updates
    ):


        combined={}



        for update in updates:


            for key,value in update["weights"].items():


                if key not in combined:

                    combined[key]=0



                combined[key]+=value



        for key in combined:


            combined[key]/=len(updates)



        return {


            "global_model":

            combined

        }



if __name__=="__main__":


    aggregator=FederatedAggregator()



    updates=[


        {

        "weights":

        {

        "feature_1":0.5,

        "feature_2":0.3

        }

        },


        {

        "weights":

        {

        "feature_1":0.7,

        "feature_2":0.5

        }

        }

    ]



    print(

        aggregator.aggregate(

            updates

