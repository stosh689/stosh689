    def register_shutdown(

        self,

        task: Callable

    ):

        self.shutdown_tasks.append(task)



    def startup(self):

        print(

            "Starting GEDT..."

        )


        for task in self.startup_tasks:

            task()


        self.running = True


        print(

            "GEDT started",

            datetime.utcnow()

        )



    def shutdown(self):

        print(

            "Stopping GEDT..."

        )


        for task in reversed(

            self.shutdown_tasks

        ):

            task()


        self.running = False


        print(

            "GEDT shutdown complete",

            datetime.utcnow()

        )



    def status(self):

        return {

            "running":

            self.running,

            "timestamp":

            datetime.utcnow().isoformat()

        }


