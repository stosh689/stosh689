from sklearn.ensemble import RandomForestClassifier

import pandas as pd
import random



# =============================
# DATABASE
# =============================

engine = create_engine(
    "sqlite:///gedt_learning.db"
)

Session = sessionmaker(
    bind=engine
)

Base = declarative_base()



class Experience(Base):

    __tablename__="experience"


    id=Column(
        Integer,
        primary_key=True
    )

    temperature=Column(
        Float
    )

    vibration=Column(
        Float
    )

    pressure=Column(
        Float
    )

    failure=Column(
        Integer
    )



Base.metadata.create_all(
    engine
)



# =============================
# SENSOR
# =============================

class Sensor:


    def read(self):

        temperature=random.randint(
            70,100
        )

        vibration=round(
            random.uniform(1,10),
            2
        )

        pressure=random.randint(
            90,120
        )


        failure = 1 if (

            temperature > 90

            and vibration > 7

        ) else 0


        return {

        "temperature":temperature,

        "vibration":vibration,

        "pressure":pressure,

        "failure":failure

        }



# =============================
# LEARNING ENGINE
# =============================

class LearningEngine:


    def __init__(self):

        self.model = RandomForestClassifier(

            n_estimators=50

        )



    def train(self):

        db=Session()


        records=db.query(
            Experience
        ).all()


        db.close()


        if len(records)<5:

            return False


        data=[]


        for r in records:

            data.append(

            {

            "temperature":
            r.temperature,

            "vibration":
            r.vibration,

            "pressure":
            r.pressure,

            "failure":
            r.failure

            }

            )


        df=pd.DataFrame(data)


        X=df[

        [

        "temperature",

        "vibration",

        "pressure"

        ]

        ]


        y=df["failure"]


        self.model.fit(
            X,
            y
        )


        return True



    def predict(self,data):


        sample=pd.DataFrame(

        [data]

        )


        return int(

        self.model.predict(

            sample

        )[0]

        )



# =============================
# GEDT CORE
# =============================

class GEDT:


    def __init__(self):

        self.sensor=Sensor()

        self.learning=LearningEngine()



    def run(self):


        data=self.sensor.read()


        db=Session()


        db.add(

        Experience(**data)

        )


        db.commit()

        db.close()



        trained=self.learning.train()



        prediction = None


        if trained:

            prediction=self.learning.predict(

            data

            )


        return {


        "sensor":

        data,


        "model_trained":

        trained,


        "prediction":

        prediction


        }



# =============================
# API
# =============================

app=FastAPI(

title="GEDT Alpha v0.7"

)



gedt=GEDT()



@app.get("/learn")

def learn_cycle():

    return gedt.run()



