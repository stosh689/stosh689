"""
============================================================
GEDT v11.0 Data Pipeline

Features:
- CSV / JSON loading
- Data validation
- Cleaning
- Feature extraction
- Dataset versioning
- Training preparation

============================================================
"""

import os
import json
import hashlib

from datetime import datetime


import pandas as pd



# ==========================================================
# DATA LOADER
# ==========================================================


class DataLoader:


    def load_csv(
        self,
        filename
    ):


        if not os.path.exists(filename):

            raise FileNotFoundError(
                filename
            )


        return pd.read_csv(
            filename
        )



    def load_json(
        self,
        filename
    ):


        with open(filename) as file:

            data=json.load(file)


        return pd.DataFrame(data)



# ==========================================================
# VALIDATION ENGINE
# ==========================================================


class DataValidator:


    REQUIRED_COLUMNS=[

        "technology",

        "investment",

        "education"

    ]



    def validate(
        self,
        dataframe
    ):


        missing=[]


        for column in self.REQUIRED_COLUMNS:


            if column not in dataframe.columns:

                missing.append(column)



        return {


            "valid":

            len(missing)==0,


            "missing":

            missing,


            "rows":

            len(dataframe)

        }



# ==========================================================
# DATA PROCESSOR
# ==========================================================


class DataProcessor:


    def clean(
        self,
        dataframe
    ):


        dataframe=dataframe.dropna()



        for column in dataframe.columns:


            dataframe[column]=(

                dataframe[column]

                .clip(
                    0,
                    1
                )

            )


        return dataframe



    def create_features(
        self,
        dataframe
    ):


        dataframe["combined_score"]=(

            dataframe["technology"]*0.5

            +

            dataframe["investment"]*0.3

            +

            dataframe["education"]*0.2

        )


        return dataframe



# ==========================================================
# DATA VERSIONING
# ==========================================================


class DatasetVersion:


    def create_hash(
        self,
        dataframe
    ):


        raw=dataframe.to_json()


        return hashlib.sha256(

            raw.encode()

        ).hexdigest()



    def metadata(
        self,
        dataframe
    ):


        return {


            "dataset_id":

            self.create_hash(
                dataframe
            ),


            "rows":

            len(dataframe),


            "created":

            datetime.utcnow()
            .isoformat()

        }



# ==========================================================
# PIPELINE
# ==========================================================


class GEDTDataPipeline:


    def run(
        self,
        dataframe
    ):


        validator=DataValidator()


        validation=validator.validate(

            dataframe

        )


        if not validation["valid"]:

            return validation



        processor=DataProcessor()



        cleaned=processor.clean(

            dataframe

        )


        features=processor.create_features(

            cleaned

        )


        version=DatasetVersion()



        return {


            "validation":

            validation,


            "dataset":

            version.metadata(

                features

            ),


            "data":

            features.to_dict(

                orient="records"

            )

        }



# ==========================================================
# DEMO
# ==========================================================


if __name__=="__main__":


    sample=pd.DataFrame(

        [

            {

            "technology":0.8,

            "investment":0.7,

            "education":0.9

            },


            {

            "technology":0.6,

            "investment":0.8,

            "education":0.5

            }

        ]

    )



    pipeline=GEDTDataPipeline()


    result=pipeline.run(

        sample

    )


