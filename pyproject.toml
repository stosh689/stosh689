from datetime import datetime



class KnowledgeBase:


    def search(self,query):


        knowledge={


        "temperature":

        "High temperature indicates thermal stress.",


        "vibration":

        "High vibration indicates mechanical imbalance."

        }


        results=[]


        for key,value in knowledge.items():

            if key in query.lower():

                results.append(value)


        return results



class EngineeringAgent:


    def analyze(self,state):


        findings=[]



        if state["temperature"]>90:

            findings.append(

            "Thermal overload detected"

            )


        if state["vibration"]>7:

            findings.append(

            "Mechanical instability detected"

            )


        return findings



class Copilot:


    def __init__(self):

        self.kb=KnowledgeBase()

        self.engineer=EngineeringAgent()



