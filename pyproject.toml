"""
============================================================
GEDT v12 Authentication Manager

Handles identity verification.

============================================================
"""

import hashlib

from datetime import datetime



class AuthenticationManager:


    def __init__(self):

        self.users={}



    def register(
        self,
        user_id,
        secret
    ):


        hashed=hashlib.sha256(

            secret.encode()

        ).hexdigest()



        self.users[user_id]={


            "credential":

            hashed,


            "created":

            datetime.utcnow()
            .isoformat()

        }



    def authenticate(
        self,
        user_id,
        secret
    ):


        if user_id not in self.users:

            return False



        hashed=hashlib.sha256(

            secret.encode()

        ).hexdigest()



        return (

            hashed ==

            self.users[user_id]["credential"]

        )



if __name__=="__main__":


    auth=AuthenticationManager()



    auth.register(

        "agent_admin",

        "secure_key"

    )


    print(

        auth.authenticate(

            "agent_admin",

            "secure_key"

        )

    )


"""
============================================================
GEDT v12 Authorization Engine

Controls permissions.

============================================================
"""


class AuthorizationEngine:


    def __init__(self):

        self.permissions={}



    def grant(
        self,
        identity,
        permission
    ):


        if identity not in self.permissions:

            self.permissions[identity]=[]



        self.permissions[identity].append(

            permission

        )



    def check(
        self,
        identity,
        permission
    ):


        return permission in self.permissions.get(

            identity,

            []

        )



if __name__=="__main__":


    access=AuthorizationEngine()



    access.grant(

        "agent_admin",

        "run_simulation"

    )



    print(

        access.check(

            "agent_admin",

            "run_simulation"

        )

    )


