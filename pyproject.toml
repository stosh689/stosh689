"""
GEDT Configuration Manager

Provides:
- Environment variable overrides
- JSON configuration loading
- Dot-notation access
- Immutable runtime configuration
"""

from __future__ import annotations

import json
import os
from dataclasses import dataclass, field
from pathlib import Path
from typing import Any, Dict


DEFAULT_CONFIG = {
    "application": {
        "name": "GEDT",
        "version": "2.2.1"
    },
    "logging": {
        "level": "INFO"
    },
    "simulation": {
        "default_steps": 10
    },
    "digital_twin": {
        "auto_update": True
    },
    "mlops": {
        "enable_monitoring": True
    }
}


@dataclass(frozen=True)
class Config:

    values: Dict[str, Any] = field(default_factory=dict)

    def get(self, path: str, default: Any = None) -> Any:
        """
        Example:
            config.get("logging.level")
        """
        current = self.values

        for key in path.split("."):
            if not isinstance(current, dict):
                return default

            current = current.get(key)

            if current is None:
                return default

        return current


class ConfigManager:

    def __init__(self):

        self._config = DEFAULT_CONFIG.copy()

    def load_json(self, filename: str):

        path = Path(filename)

        if path.exists():

            with open(path, "r", encoding="utf-8") as fp:

                user_config = json.load(fp)

            self._merge(self._config, user_config)

    def load_environment(self):

        if "GEDT_LOG_LEVEL" in os.environ:
            self._config["logging"]["level"] = os.environ["GEDT_LOG_LEVEL"]

        if "GEDT_SIMULATION_STEPS" in os.environ:
            self._config["simulation"]["default_steps"] = int(
                os.environ["GEDT_SIMULATION_STEPS"]
            )

    def build(self) -> Config:

        return Config(values=self._config)

    def _merge(self, base: Dict, incoming: Dict):

        for key, value in incoming.items():

            if (
                key in base
                and isinstance(base[key], dict)
                and isinstance(value, dict)
            ):
                self._merge(base[key], value)
            else:
                base[key] = value

