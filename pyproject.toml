"""
GEDT Sensor Validation
"""


class SensorValidator:


    def validate(

        self,

        reading

    ):


        if reading.value is None:

            return False


        return True

"""
GEDT Sensor Fusion
"""


class SensorFusion:


    def combine(

        self,

        readings

    ):


        values = [

            r.value

            for r in readings

        ]


        return {

            "combined_value":

            sum(values)

            /

            len(values),


            "sources":

            len(values)

        }


