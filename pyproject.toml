# -----------------------------

class DigitalTwin:

    def __init__(self, asset_id):
        self.asset_id = asset_id
        self.state = {}

    def update(self, data):
        self.state.update(data)

    def get_state(self):
        return self.state



# -----------------------------
# ML-Inspired Predictor
# -----------------------------

class FailurePredictor:

    def predict(self, state):

        temperature = state.get(
            "temperature", 0
        )

        vibration = state.get(
            "vibration", 0
        )

        pressure = state.get(
            "pressure", 0
        )


        score = (

            temperature * 0.005

            +

            vibration * 0.05

            +

            pressure * 0.002

        )


        return min(
            round(score,3),
            1.0
        )



# -----------------------------
# Simulation Engine
# -----------------------------

class SimulationEngine:


    def simulate(self,state):

        temperature = state["temperature"]


        return [

            {
            "action":
            "Increase Cooling",

            "risk":
            0.35,

            "cost":
            20,

            "temperature":
            temperature - 15

            },


            {
            "action":
            "Reduce Load",

            "risk":
            0.25,

            "cost":
            10,

            "temperature":
            temperature - 8

            },


            {
            "action":
            "Maintenance",

            "risk":
            0.10,

            "cost":
            30,

            "temperature":
            temperature - 12

            }

        ]



# -----------------------------
# Optimization
# -----------------------------

class Optimizer:


    def choose(self,options):

        best = None

        lowest_score = 999


        for option in options:


            score = (

                option["risk"] * 0.7

                +

                option["cost"] * 0.3

            )


            if score < lowest_score:

                lowest_score = score

                best = option


        return best



# -----------------------------
# Memory
# -----------------------------

class Memory:


    def __init__(self):

        self.records = []


    def store(self,event):

        self.records.append(event)



    def history(self):

        return self.records



# -----------------------------
# GEDT CORE
# -----------------------------

class GEDT:


    def __init__(self,asset_id):

        self.twin = DigitalTwin(
            asset_id
        )

        self.predictor = FailurePredictor()

        self.simulator = SimulationEngine()

        self.optimizer = Optimizer()

        self.memory = Memory()



    def run(self,sensor_data):


        # Update Twin

        self.twin.update(
            sensor_data
        )


        state = self.twin.get_state()



        # Predict Failure

        probability = self.predictor.predict(

            state

        )


        # Simulate Options

        scenarios = self.simulator.simulate(

            state

        )


        # Select Best Action

        decision = self.optimizer.choose(

            scenarios

        )


        result = {


        "asset":

        self.twin.asset_id,


        "time":

        str(datetime.utcnow()),


        "state":

        state,


        "failure_probability":

        probability,


        "recommended_action":

        decision


        }


        self.memory.store(

            result

        )


        return result



