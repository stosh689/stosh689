"""
GEDT Model Registry

Tracks trained models and versions.
"""

from dataclasses import dataclass
from datetime import datetime


@dataclass
class ModelInfo:

    name: str

    version: str

    path: str

    created: str



class ModelRegistry:


    def __init__(self):

        self.models = {}



    def register(

        self,

        name: str,

        version: str,

        path: str

    ):


        model = ModelInfo(

            name=name,

            version=version,

            path=path,

            created=datetime.utcnow()
            .isoformat()

        )


        self.models[name] = model


        return model



    def get(

        self,

        name: str

    ):


        return self.models.get(name)



registry = ModelRegistry()



