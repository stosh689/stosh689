from concurrent.futures import ProcessPoolExecutor



def execute_parallel(
    experiments
):

    with ProcessPoolExecutor() as pool:

        results=list(

            pool.map(

                run_single,

                experiments

            )

        )


    return results



def run_single(
    config
):

    from gedt.simulation.engine import SimulationEngine


    return SimulationEngine().run(
        **config
    )

