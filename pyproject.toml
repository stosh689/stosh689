"""
GEDT Model Training
"""

from pathlib import Path

import joblib

from sklearn.ensemble import RandomForestClassifier


from app.ml.dataset import DatasetLoader



MODEL_PATH = Path(

    "models/saved_models/gedt_model.pkl"

)



def train():


    loader = DatasetLoader()


    X_train, _, y_train, _ = loader.load()



    model = RandomForestClassifier(

        n_estimators=100,

        random_state=42

    )


    model.fit(

        X_train,

        y_train

    )


    MODEL_PATH.parent.mkdir(

        parents=True,

        exist_ok=True

    )


    joblib.dump(

        model,

        MODEL_PATH

    )


    return MODEL_PATH



if __name__ == "__main__":

