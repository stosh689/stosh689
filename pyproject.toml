"""
GEDT v11.0 Data Platform

Features:
- Experiment database
- Digital Twin snapshots
- Model registry
- Research history
"""


from datetime import datetime
from sqlalchemy import (
    create_engine,
    Column,
    Integer,
    String,
    Float,
    Text
)

from sqlalchemy.orm import (
    declarative_base,
    sessionmaker
)


# ==========================================================
# DATABASE SETUP
# ==========================================================


DATABASE="sqlite:///gedt_v11.db"


engine=create_engine(
    DATABASE,
    echo=False
)


Base=declarative_base()


Session=sessionmaker(
    bind=engine
)



# ==========================================================
# DATABASE MODELS
# ==========================================================


class Experiment(Base):

    __tablename__="experiments"


    id=Column(
        Integer,
        primary_key=True
    )


    experiment_id=Column(
        String
    )


    population=Column(
        Integer
    )


    productivity=Column(
        Float
    )


    timestamp=Column(
        String
    )



class TwinSnapshot(Base):

    __tablename__="twin_history"


    id=Column(
        Integer,
        primary_key=True
    )


    state=Column(
        Text
    )


    timestamp=Column(
        String
    )



class ModelRegistry(Base):

    __tablename__="models"


    id=Column(
        Integer,
        primary_key=True
    )


    name=Column(
        String
    )


    version=Column(
        String
    )


    status=Column(
        String
    )



# Create tables

Base.metadata.create_all(
    engine
)



# ==========================================================
# DATA PLATFORM
# ==========================================================


class GEDTDataPlatform:



    def __init__(self):

        self.session=Session()



    def save_experiment(
        self,
        experiment_id,
        population,
        productivity
    ):


        record=Experiment(

            experiment_id=
            experiment_id,

            population=
            population,

            productivity=
            productivity,

            timestamp=
            datetime.utcnow()
            .isoformat()

        )


        self.session.add(
            record
        )


        self.session.commit()



    def save_twin_state(
        self,
        state
    ):


        snapshot=TwinSnapshot(

            state=str(state),

            timestamp=
            datetime.utcnow()
            .isoformat()

        )


        self.session.add(
            snapshot
        )


        self.session.commit()



    def register_model(
        self,
        name,
        version
    ):


        model=ModelRegistry(

            name=name,

            version=version,

            status="active"

        )


        self.session.add(
            model
        )


        self.session.commit()



    def experiments(
        self
    ):

        return (

            self.session

            .query(
                Experiment
            )

            .all()

        )



# ==========================================================
# DEMO
# ==========================================================


if __name__=="__main__":


    db=GEDTDataPlatform()


    db.save_experiment(

        "GEDT-DEMO-001",

        100000,

        0.87

    )


    db.save_twin_state(

