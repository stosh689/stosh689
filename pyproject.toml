class GEDTCoordinator:


    def __init__(self):

        self.monitor = MonitoringAgent(
            "Monitor"
        )

        self.reasoner = ReasoningAgent(
            "Reasoner"
        )

        self.simulator = SimulationAgent(
            "Simulator"
        )

        self.optimizer = OptimizationAgent(
            "Optimizer"
        )

        self.safety = SafetyAgent(
            "Safety"
        )


    def run(self, state):

        monitoring = self.monitor.analyze(
            state
        )


        reasoning = self.reasoner.explain(
            monitoring
        )


        simulations = self.simulator.test_actions()


        decision = self.optimizer.select(
            simulations["message"]
        )


        approval = self.safety.validate(
            decision
        )


        return {

            "monitoring":

            monitoring,

            "reasoning":

            reasoning,

            "decision":

            approval

        }



