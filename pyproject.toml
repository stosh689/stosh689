"""
GEDT Authentication Utilities
"""

from passlib.context import CryptContext


password_context = CryptContext(
    schemes=["bcrypt"],
    deprecated="auto"
)



def hash_password(password: str):

    return password_context.hash(
        password
    )



def verify_password(

    plain,

    hashed

):

    return password_context.verify(

        plain,

        hashed

    )

"""
GEDT JWT Handler
"""

from datetime import datetime
from datetime import timedelta

from jose import jwt


SECRET_KEY = "CHANGE_THIS_IN_ENV"

ALGORITHM = "HS256"



def create_token(

    username: str

):

    payload = {

        "sub": username,

        "exp":

        datetime.utcnow()

        +

        timedelta(hours=8)

    }


    return jwt.encode(

        payload,

        SECRET_KEY,

        algorithm=ALGORITHM

    )

"""
GEDT Permissions
"""


ROLES = {

    "admin": [

        "read",

        "write",

        "manage"

    ],


    "analyst": [

        "read",

        "write"

    ],


    "user": [

        "read"

    ]

}



def has_permission(

    role,

    permission

):


    return permission in ROLES.get(

        role,

        []

    )


