        self.history=[]



    def store(
        self,
        event
    ):


        self.history.append(

            {

            "event":

            event,


            "time":

            datetime.utcnow()
            .isoformat()

            }

        )



    def recall(self):

        return self.history



class AutonomousAgent:


    def __init__(
        self,
        name
    ):

        self.name=name

        self.memory=AgentMemory()



    def observe(
        self,
        environment
    ):


        self.memory.store(

            {

            "observation":

            environment

            }

        )


        return environment



    def decide(
        self,
        goal
    ):


        decision={


            "agent":

            self.name,


            "goal":

            goal,


            "action":

            "optimize_next_step"

        }



        self.memory.store(

            decision

        )


        return decision



    def evaluate(self):


        return {


            "agent":

            self.name,


            "memory_events":

            len(

                self.memory.history

            )

        }



