from dataclasses import dataclass


@dataclass
class SimulationState:

    temperature: float

    vibration: float

    energy_usage: float

    risk: float


class Scenario:


    def __init__(

        self,

        name,

        changes

    ):

        self.name = name

        self.changes = changes



class Simulator:


    def run(

        self,

        state,

        scenario

    ):


        new_temperature = (

            state.temperature

            +

            scenario.changes.get(

                "temperature",

                0

            )

        )


        new_energy = (

            state.energy_usage

            +

            scenario.changes.get(

                "energy_usage",

                0

            )

        )


        risk = (

            new_temperature * 0.5

            +

            state.vibration * 5

        )


        return {

            "scenario":

            scenario.name,


            "temperature":

            new_temperature,


            "energy":

            new_energy,


            "risk":

            risk

        }


class Evaluator:


    def rank(

        self,

        results

    ):


        return sorted(

            results,

            key=lambda x:

            x["risk"]

        )


