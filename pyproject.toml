"""

import random



class PrivacyManager:


    def add_noise(
        self,
        value,
        level=0.01
    ):


        noise=random.uniform(

            -level,

            level

        )


        return value + noise



    def protect(
        self,
        model
    ):


        protected={}



        for key,value in model.items():


            protected[key]=self.add_noise(

                value

            )



        return protected



if __name__=="__main__":


    privacy=PrivacyManager()



    print(

        privacy.protect(

