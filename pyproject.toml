"""
GEDT Digital Twin State
"""

from dataclasses import dataclass


@dataclass
class DigitalTwinState:
    """
    Represents current system conditions.
    """

    population: int

    resources: float

    demand: float

    risk_level: float



"""
GEDT Simulation Scenario
"""

from dataclasses import dataclass


@dataclass
class Scenario:

    name: str

    resource_change: float

    demand_change: float

    risk_change: float


"""
GEDT Simulation Engine
"""

from app.simulation.state import DigitalTwinState
from app.simulation.scenario import Scenario



class SimulationEngine:


    def run(

        self,

        state: DigitalTwinState,

        scenario: Scenario

    ):


        new_resources = (

            state.resources

            +

            scenario.resource_change

        )


        new_demand = (

            state.demand

            *

            (1 + scenario.demand_change)

        )


        new_risk = (

            state.risk_level

            +

            scenario.risk_change

        )


        return {

            "resources":

            new_resources,


            "demand":

            new_demand,


            "risk":

            new_risk

        }


"""
GEDT Simulation Metrics
"""


def calculate_score(

    resources: float,

    demand: float,

    risk: float

):


    availability = (

        resources /

        max(demand, 1)

    )


    score = (

        availability

        -

        risk

    )


    return max(

        0,

        min(

            score,

            1

        )

    )


"""
GEDT Scenario Optimizer
"""


class ScenarioOptimizer:


    def choose_best(

        self,

        scenarios

    ):


        return max(

            scenarios,

            key=lambda x:

            x["score"]

        )

