            action="Maintenance"

        elif risk > 0.45:

            action="Inspection"

        else:

            action="Continue"



        self.save(

            name,

            data,

            risk,

            action

        )


        return {

        "asset":name,

        "sensor":data,

        "risk":round(risk,3),

        "action":action

        }



