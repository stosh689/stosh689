            0,

            confidence=

            0.90

        )



class ExperimentAgent:


    def simulate(self, hypothesis):


        improvement = (

            hypothesis.expected_improvement

        )


        return {


            "hypothesis":

            hypothesis.description,


            "result":

            improvement,


            "success":

            improvement > 0.15

        }






class EvaluationAgent:


    def evaluate(self, experiment):


        if experiment["success"]:


            return {

            "recommendation":

            "Approve improvement test",

            "confidence":

            experiment["result"]

            }


        return {

            "recommendation":

            "Reject proposal",

            "confidence":

            0

        }



