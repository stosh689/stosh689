from datetime import datetime



class SynchronizationManager:


    def __init__(self):

        self.nodes={}



    def register_node(
        self,
        node_id
    ):


        self.nodes[node_id]={


            "connected":

            True,


            "last_sync":

            datetime.utcnow()
            .isoformat()

        }



    def sync(
        self,
        node_id,
        data
    ):


        if node_id in self.nodes:


            self.nodes[node_id]["last_sync"]=datetime.utcnow().isoformat()


            self.nodes[node_id]["data"]=data



        return {


            "node":

            node_id,


            "synchronized":

            True

        }



    def network_status(self):


        return self.nodes



