"""
============================================================
GEDT v12 Resource Optimizer

Balances compute allocation.

============================================================
"""


class ResourceOptimizer:


    def allocate(
        self,
        workloads,
        resources
    ):


        allocation={}



        available=resources



        for workload in workloads:


            required=workloads[workload]



            if required <= available:


                allocation[workload]=required


                available-=required



            else:


                allocation[workload]="queued"



        return {


            "allocation":

            allocation,


            "remaining":

            available

        }



if __name__=="__main__":


    optimizer=ResourceOptimizer()



    print(

        optimizer.allocate(

            {

            "AI_training":

            40,


            "simulation":

            30

            },

            100

        )

    )

