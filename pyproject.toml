from app.sensors.validation import SensorValidator

from app.sensors.fusion import SensorFusion



class RealTimeProcessor:


    def __init__(self):

        self.validator = SensorValidator()

        self.fusion = SensorFusion()



    def process(

        self,

        readings

    ):


        valid = [

            r

            for r in readings

            if self.validator.validate(r)

        ]


        return self.fusion.combine(

            valid

        )

