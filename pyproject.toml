"""
Database configuration for GEDT MVD.
"""

from collections.abc import Generator

from sqlalchemy import create_engine
from sqlalchemy.orm import DeclarativeBase
from sqlalchemy.orm import Session
from sqlalchemy.orm import sessionmaker

DATABASE_URL = "sqlite:///./gedt.db"

engine = create_engine(
    DATABASE_URL,
    connect_args={"check_same_thread": False},
)

SessionLocal = sessionmaker(
    autoflush=False,
    autocommit=False,
    bind=engine,
)


class Base(DeclarativeBase):
    """Base class for all ORM models."""


def get_db() -> Generator[Session, None, None]:
    """
    FastAPI dependency.
    """

    db = SessionLocal()

    try:
        yield db
    finally:
        db.close()

"""
Prediction ORM model.
"""

from datetime import datetime

from sqlalchemy import DateTime
from sqlalchemy import Float
from sqlalchemy import Integer
from sqlalchemy import String
from sqlalchemy.orm import Mapped
from sqlalchemy.orm import mapped_column

from app.db.database import Base


class Prediction(Base):
    """
    Stores prediction history.
    """

    __tablename__ = "predictions"

    id: Mapped[int] = mapped_column(
        Integer,
        primary_key=True,
        index=True,
    )

    model_name: Mapped[str] = mapped_column(
        String(100),
    )

    prediction: Mapped[float] = mapped_column(
        Float,
    )

    confidence: Mapped[float] = mapped_column(
        Float,
    )

    created_at: Mapped[datetime] = mapped_column(
        DateTime,
        default=datetime.utcnow,
    )

"""
Prediction business logic.
"""

from sqlalchemy.orm import Session

from app.models.prediction import Prediction
from app.schemas.prediction import PredictionCreate


class PredictionService:

    @staticmethod
    def create(
        db: Session,
        prediction: PredictionCreate,
    ) -> Prediction:

        record = Prediction(
            model_name=prediction.model_name,
            prediction=prediction.prediction,
            confidence=prediction.confidence,
        )

        db.add(record)
        db.commit()
        db.refresh(record)

        return record

    @staticmethod
    def list(
        db: Session,
    ) -> list[Prediction]:

        return db.query(Prediction).all()

"""
Prediction API schemas.
"""

from datetime import datetime

from pydantic import BaseModel


class PredictionCreate(BaseModel):

    model_name: str

    prediction: float

    confidence: float


class PredictionResponse(PredictionCreate):

    id: int

    created_at: datetime

    model_config = {
        "from_attributes": True
    }

"""
Prediction API.
"""

from fastapi import APIRouter
from fastapi import Depends

from sqlalchemy.orm import Session

from app.db.database import get_db
from app.schemas.prediction import PredictionCreate
from app.schemas.prediction import PredictionResponse
from app.services.prediction_service import PredictionService

router = APIRouter(
    prefix="/predictions",
    tags=["Predictions"],
)


@router.post(
    "/",
    response_model=PredictionResponse,
)
def create_prediction(
    prediction: PredictionCreate,
    db: Session = Depends(get_db),
):

    return PredictionService.create(
        db,
        prediction,
    )


@router.get(
    "/",
    response_model=list[PredictionResponse],
)
def list_predictions(
    db: Session = Depends(get_db),
):

    return PredictionService.list(db)



