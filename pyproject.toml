"""
GEDT System Orchestrator
"""


class GEDTOrchestrator:


    def __init__(

        self,

        twin,

        ai,

        decision,

        governance

    ):

        self.twin = twin

        self.ai = ai

        self.decision = decision

        self.governance = governance



    def process(

        self,

        data

    ):


        state = self.twin.update(

            data

        )


        prediction = self.ai.predict(

            state

        )


        action = self.decision.decide(

            prediction

        )


        return self.governance.record(

            action

        )




