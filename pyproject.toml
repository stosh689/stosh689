"""
============================================================
GEDT v11.0 Security Layer

Features:
- API key authentication
- Input validation
- Audit logging
- Secure configuration
- Runtime protection

============================================================
"""

import os
import json
import hashlib

from datetime import datetime



# ==========================================================
# SECURITY CONFIGURATION
# ==========================================================

class SecurityConfig:


    def __init__(self):

        self.api_key=os.getenv(

            "GEDT_API_KEY",

            "development-key"

        )


    def hash_key(
        self,
        key
    ):

        return hashlib.sha256(

            key.encode()

        ).hexdigest()



# ==========================================================
# AUTHENTICATION
# ==========================================================

class Authentication:


    def __init__(self):

        self.config=SecurityConfig()



    def verify(
        self,
        provided_key
    ):


        return (

            self.config.hash_key(

                provided_key

            )

            ==

            self.config.hash_key(

                self.config.api_key

            )

        )



# ==========================================================
# INPUT VALIDATION
# ==========================================================

class InputValidator:


    def validate_experiment(
        self,
        experiment
    ):


        required=[

            "technology",

            "investment",

            "education"

        ]


        for field in required:


            if field not in experiment:

                return False



            if not isinstance(

                experiment[field],

                (int,float)

            ):

                return False



            if not 0 <= experiment[field] <= 1:

                return False



        return True



# ==========================================================
# AUDIT LOGGER
# ==========================================================

class AuditLogger:


    def __init__(
        self,
        filename="gedt_security_audit.json"
    ):

        self.filename=filename

        self.events=[]



    def record(
        self,
        event,
        status
    ):


        self.events.append(

            {

            "event":

            event,


            "status":

            status,


            "timestamp":

            datetime.utcnow()
            .isoformat()

            }

        )



    def save(self):


        with open(

            self.filename,

            "w"

        ) as file:


            json.dump(

                self.events,

                file,

                indent=4

            )



# ==========================================================
# SECURITY MANAGER
# ==========================================================

class SecurityManager:


    def __init__(self):

        self.auth=Authentication()

        self.validator=InputValidator()

        self.audit=AuditLogger()



    def authorize(
        self,
        api_key
    ):


        result=self.auth.verify(

            api_key

        )


        self.audit.record(

            "authentication",

            result

        )


        return result



    def validate_request(
        self,
        data
    ):


        result=self.validator.validate_experiment(

            data

        )


        self.audit.record(

            "input_validation",

            result

        )


        return result



    def shutdown_report(self):

        self.audit.save()



# ==========================================================
# TEST
# ==========================================================

if __name__=="__main__":


    security=SecurityManager()



    authenticated=security.authorize(

        "development-key"

    )


    valid=security.validate_request(

        {

        "technology":0.8,

        "investment":0.7,

        "education":0.9

        }

    )


    security.shutdown_report()



    print(

        {

        "authenticated":

        authenticated,


        "valid_input":

        valid

        }

    )


