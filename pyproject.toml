"""
============================================================
GEDT v11.0 Knowledge Graph + Memory Layer

Features:
- Experiment memory
- Knowledge graph
- Relationship mapping
- Historical reasoning
- Similar experiment search

============================================================
"""


import json
import uuid

from datetime import datetime

import networkx as nx



# ==========================================================
# KNOWLEDGE GRAPH
# ==========================================================


class KnowledgeGraph:


    def __init__(self):

        self.graph = nx.Graph()



    def add_node(
        self,
        node_id,
        data
    ):

        self.graph.add_node(

            node_id,

            **data

        )



    def connect(
        self,
        node_a,
        node_b,
        relationship
    ):

        self.graph.add_edge(

            node_a,

            node_b,

            relationship=relationship

        )



    def search(
        self,
        keyword
    ):


        results=[]


        for node,data in self.graph.nodes(
            data=True
        ):

            text=str(data)


            if keyword.lower() in text.lower():

                results.append(

                    {

                    "id":node,

                    "data":data

                    }

                )


        return results



    def export(self):

        return {

            "nodes":

            list(

                self.graph.nodes(
                    data=True
                )

            ),

            "edges":

            list(

                self.graph.edges(
                    data=True
                )

            )

        }



# ==========================================================
# MEMORY SYSTEM
# ==========================================================


class GEDTMemory:


    def __init__(self):

        self.knowledge=KnowledgeGraph()



    def remember_experiment(
        self,
        experiment,
        score
    ):


        experiment_id=(

            "EXP-"

            +

            str(uuid.uuid4())

        )


        self.knowledge.add_node(

            experiment_id,

            {

                "type":
                "experiment",

                "parameters":
                experiment,

                "score":
                score,

                "timestamp":
                datetime.utcnow()
                .isoformat()

            }

        )


        return experiment_id



    def relate(
        self,
        old_id,
        new_id
    ):

        self.knowledge.connect(

            old_id,

            new_id,

            "similar_experiment"

        )



    def recall(
        self,
        query
    ):

        return self.knowledge.search(

            query

        )



# ==========================================================
# REASONING ENGINE
# ==========================================================


class ReasoningEngine:


    def __init__(
        self,
        memory
    ):

        self.memory=memory



    def analyze(
        self
    ):


        graph=(

            self.memory
            .knowledge
            .graph

        )


        if len(graph)==0:

            return {

                "knowledge":

                "empty"

            }



        scores=[]


        for _,data in graph.nodes(
            data=True
        ):

            if "score" in data:

                scores.append(

                    data["score"]

                )


        return {

            "experiments":

            len(scores),


            "best_score":

            max(scores)

            if scores

            else 0

        }



# ==========================================================
# DEMO
# ==========================================================


if __name__=="__main__":


    memory=GEDTMemory()



    first=memory.remember_experiment(

        {

            "technology":
            0.8,

            "investment":
            0.7

        },

        0.82

    )



    second=memory.remember_experiment(

        {

            "technology":
            0.85,

            "investment":
            0.75

        },

        0.91

    )



    memory.relate(

        first,

        second

    )



    reasoning=ReasoningEngine(

        memory

    )


    report={

        "system":

        "GEDT v11 Knowledge Memory",

        "analysis":

        reasoning.analyze(),

        "graph":

        memory.knowledge.export()

    }



    with open(

        "gedt_memory_report.json",

        "w"

    ) as file:


        json.dump(

            report,

            file,

            indent=4,

            default=str

        )


    print(

        json.dumps(

            reasoning.analyze(),

            indent=4

        )

    )




