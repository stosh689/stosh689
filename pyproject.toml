"""
GEDT JWT Token Management
"""

from datetime import datetime, timedelta

from jose import jwt


SECRET_KEY = "GEDT_DEVELOPMENT_SECRET"

ALGORITHM = "HS256"


TOKEN_EXPIRATION_MINUTES = 60



def create_token(data: dict):

    payload = data.copy()

    payload["expires"] = (

        datetime.utcnow()

        +

        timedelta(
            minutes=
            TOKEN_EXPIRATION_MINUTES
        )

    ).isoformat()


    return jwt.encode(

        payload,

        SECRET_KEY,

        algorithm=ALGORITHM

    )



def decode_token(token: str):

    return jwt.decode(

        token,

        SECRET_KEY,

        algorithms=[ALGORITHM]

    )

