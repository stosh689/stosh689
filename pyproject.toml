"""
GEDT Structured Logging System

Features:
- Console logging
- File logging
- JSON-style structured events
- Execution tracing
- Module identification
"""

from __future__ import annotations

import json
import logging
import time
from datetime import datetime
from pathlib import Path


class GEDTLogger:


    def __init__(

        self,

        name: str = "GEDT",

        log_file: str = "logs/gedt.log"

    ):

        self.logger = logging.getLogger(name)

        self.logger.setLevel(logging.INFO)


        Path(log_file).parent.mkdir(

            parents=True,

            exist_ok=True

        )


        formatter = logging.Formatter(

            "%(asctime)s | %(levelname)s | %(message)s"

        )


        if not self.logger.handlers:

            console = logging.StreamHandler()

            console.setFormatter(formatter)


            file_handler = logging.FileHandler(

                log_file

            )

            file_handler.setFormatter(formatter)


            self.logger.addHandler(console)

            self.logger.addHandler(file_handler)



    def info(

        self,

        message,

        metadata=None

    ):

        self.logger.info(

            self._format(

                message,

                metadata

            )

        )



    def error(

        self,

        message,

        metadata=None

    ):

        self.logger.error(

            self._format(

                message,

                metadata

            )

        )



    def warning(

        self,

        message,

        metadata=None

    ):

        self.logger.warning(

            self._format(

                message,

                metadata

            )

        )



    def _format(

        self,

        message,

        metadata

    ):

        event = {

            "timestamp":

            datetime.utcnow().isoformat(),

            "message":

            message,

            "metadata":

            metadata or {}

        }


        return json.dumps(event)



class Timer:


    """
    Measures GEDT component execution time.
    """


    def __init__(self, logger, operation):

        self.logger = logger

        self.operation = operation


    def __enter__(self):

        self.start = time.time()

        self.logger.info(

            "Started",

            {

                "operation":

                self.operation

            }

        )

        return self



    def __exit__(self, exc_type, exc, traceback):

        duration = (

            time.time()

            -

            self.start

        )


        self.logger.info(

            "Completed",

            {

                "operation":

                self.operation,


                "duration_seconds":

                duration

            }

        )


