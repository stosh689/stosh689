"""
GEDT Retry Utility
"""


import time



def retry(

    attempts=3

):


    def decorator(func):


        def wrapper(*args, **kwargs):


            for attempt in range(attempts):

                try:

                    return func(

                        *args,

                        **kwargs

                    )


                except Exception:

                    time.sleep(1)


            raise Exception(

                "Operation failed"

            )


        return wrapper


    return decorator

