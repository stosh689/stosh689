    ):


        allowed=[

        "MONITOR",

        "INSPECT",

        "MAINTAIN"

        ]


        return action in allowed



    def audit(

        self,

        user,

        action

    ):


        return {


        "user":

        user,


        "action":

        action,


        "time":

        str(datetime.now())

        }



