import numpy as np


class Population:

    def __init__(self, size):

        self.skill = np.random.random(size)
        self.resources = np.random.random(size)
        self.adaptability = np.random.random(size)


    def innovate(self, rate):

        self.skill += (
            rate *
            self.adaptability
        )

        self.skill = np.clip(
            self.skill,
            0,
            1
        )


    def productivity(self):

        return np.mean(
            self.skill *
            self.resources
        )


