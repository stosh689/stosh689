@app.get("/results")
def get_results():

    return experiments



@app.get("/twin")
def get_twin():

    return {

        "state":
        runtime.twin.values,

        "timestamp":
        runtime.twin.timestamp

    }



# ==========================================================
# LOCAL EXECUTION
# ==========================================================


if __name__=="__main__":

    import uvicorn


    uvicorn.run(

        app,

        host="0.0.0.0",

        port=8000

    )



