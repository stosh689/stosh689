        return scenario



    def simulate(
        self,
        scenario
    ):


        variables=scenario["variables"]


        score=sum(

            variables.values()

        ) / len(variables)



        return {


            "scenario":

            scenario["name"],


            "outcome_score":

            score,


            "status":

            "completed"

        }



    def list_scenarios(self):


        return self.scenarios



