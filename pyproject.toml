import subprocess

from datetime import datetime



VERSION="v11.0.0"



class GitRelease:


    def status(self):


        result=subprocess.run(

            [

            "git",

            "status",

            "--short"

            ],

            capture_output=True,

            text=True

        )


        return result.stdout



    def create_tag_command(self):


        return f"""

git add .

git commit -m "GEDT {VERSION} stable release"

git tag -a {VERSION} -m "GEDT {VERSION}"

git push origin {VERSION}

"""



if __name__=="__main__":


    release=GitRelease()



    print(

