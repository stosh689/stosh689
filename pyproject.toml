        self.state=data



# =============================
# WORLD MODEL
# =============================

class WorldModel:


    def simulate_future(

        self,

        state,

        action

    ):


        temperature = state["temperature"]

        vibration = state["vibration"]



        if action=="Maintenance":

            temperature -= random.randint(
                10,20
            )

            vibration -= random.uniform(
                2,4
            )


        elif action=="Reduce Load":

            temperature -= random.randint(
                5,10
            )

            vibration -= random.uniform(
                1,2
            )


        else:

            temperature += random.randint(
                5,15
            )

            vibration += random.uniform(
                1,3
            )



        risk=(

            temperature*0.005

            +

            vibration*0.05

        )


        return {


        "future_temperature":

        round(temperature,2),


        "future_vibration":

        round(vibration,2),


        "future_risk":

        round(

        min(risk,1),

        3

        )


        }



# =============================
# MONTE CARLO SIMULATOR
# =============================

class SimulationEngine:


    def __init__(self):

        self.world=WorldModel()



    def run(

        self,

        state,

        action,

        trials=100

    ):


        results=[]


        for _ in range(trials):


            result=self.world.simulate_future(

                state,

                action

            )


            results.append(result)



        average_risk=sum(

            r["future_risk"]

            for r in results

        )/trials



        return {


        "action":

        action,


        "average_future_risk":

        round(

        average_risk,

        3

        ),


        "trials":

        trials

        }



# =============================
# OPTIMIZER
# =============================

class FutureOptimizer:


    def choose(

        self,

        simulations

    ):


        return min(

            simulations,

            key=lambda x:

            x["average_future_risk"]

        )



# =============================
# GEDT WORLD ENGINE
# =============================

class GEDTWorldEngine:


    def __init__(self,asset):

        self.twin=DigitalTwin(

            asset

