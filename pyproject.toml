"""
GEDT Decision Engine
"""


from app.decision.rules import RULES



class DecisionEngine:


    def decide(

        self,

        alerts

    ):


        actions = []


        for alert in alerts:


            if alert in RULES:

                actions.append(

                    RULES[alert]

                )


        return actions



