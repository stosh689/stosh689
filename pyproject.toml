"""
GEDT v11 Encryption Utility
"""

from cryptography.fernet import Fernet



class Encryption:


    def __init__(self):


        self.key=Fernet.generate_key()


        self.engine=Fernet(

            self.key

        )



    def encrypt(
        self,
        data
    ):


        return self.engine.encrypt(

            data.encode()

        )



    def decrypt(
        self,
        encrypted
    ):


        return self.engine.decrypt(

            encrypted

        ).decode()



if __name__=="__main__":


    crypto=Encryption()


    secret=crypto.encrypt(

        "GEDT confidential data"

    )


