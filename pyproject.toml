class CausalReasoner:


    def __init__(self, graph):

        self.graph = graph



    def explain(self, condition):


        chain = []


        connections = self.graph.find_connections(

            condition

        )


        for item in connections:

            chain.append(

                {

                "cause":

                item["source"],


                "effect":

                item["target"]

                }

            )


        return chain


class Reasoner:


    def explain_failure(

        self,

        causal_chain

    ):


        explanation = []


        for step in causal_chain:


            explanation.append(

                f"{step['cause']} -> {step['effect']}"

            )


        return explanation



