"""
GEDT v12
Inference Engine
"""


class InferenceEngine:

    def __init__(self):
        self.loaded_models = {}

    def load(
        self,
        model_name,
        model_callable
    ):

        self.loaded_models[model_name] = model_callable

    def predict(
        self,
        model_name,
        input_data
    ):

        if model_name not in self.loaded_models:
            raise ValueError("Model not loaded.")

        return self.loaded_models[model_name](input_data)


if __name__ == "__main__":

    engine = InferenceEngine()

    engine.load(
        "demo_model",
        lambda x: {"prediction": sum(x)}
    )

    print(
        engine.predict(
            "demo_model",
            [1, 2, 3]
        )
    )


"""
GEDT v12
Training Pipeline
"""

from datetime import datetime


class TrainingPipeline:

    def __init__(self):
        self.jobs = []

    def submit_job(
        self,
        model_name,
        dataset_name,
        parameters=None
    ):

        job = {
            "model": model_name,
            "dataset": dataset_name,
            "parameters": parameters or {},
            "status": "queued",
            "submitted": datetime.utcnow().isoformat()
        }

        self.jobs.append(job)

        return job

    def complete_job(
        self,
        index
    ):

        self.jobs[index]["status"] = "completed"

        return self.jobs[index]


if __name__ == "__main__":

    pipeline = TrainingPipeline()

    job = pipeline.submit_job(
        "resource_forecaster",
        "sample_dataset"
    )

    pipeline.complete_job(0)

    print(job)

