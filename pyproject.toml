from pathlib import Path

import json



class ModelStore:


    def __init__(self):

        self.path = Path(
            "models/registry"
        )

        self.path.mkdir(
            parents=True,
            exist_ok=True
        )



    def register(

        self,

        name,

        version,

        metrics

    ):


        record = {

            "name": name,

            "version": version,

            "metrics": metrics

        }


        file = self.path / (

            f"{name}_{version}.json"

        )


        file.write_text(

            json.dumps(
                record,
                indent=4
            )

        )


        return record



