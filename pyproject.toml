class Gateway:


    def __init__(

        self,

        registry

    ):

        self.registry = registry



    def route(

        self,

        service,

        request

    ):


        endpoint = self.registry.locate(

            service

        )


        return {

            "target":

            endpoint,


            "request":

            request

        }





"""
GEDT API Protection
"""


class RateLimiter:


    def __init__(self):

        self.requests = {}



    def allow(

        self,

        client

    ):


        count = self.requests.get(

            client,

            0

        )


        if count > 100:

            return False


        self.requests[client] = count + 1


        return True




