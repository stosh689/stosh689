class EventBroker:


    def __init__(self):

        self.queue=[]



    def publish(self,event):

        self.queue.append(event)



    def consume(self):

        events=self.queue

        self.queue=[]

        return events


class StreamProcessor:


    def __init__(self,twin):

        self.twin=twin



    def process(self,events):


        for event in events:


            self.twin.update_metric(

                event.asset_id,

                event.metric,

                event.value

            )


class RealtimeTwin:


    def __init__(self):

        self.assets={}



    def update_metric(

        self,

        asset_id,

        metric,

        value

    ):


        if asset_id not in self.assets:

            self.assets[asset_id]={}


        self.assets[asset_id][metric]=value



    def get_state(

        self,

        asset_id

    ):

        return self.assets.get(

            asset_id,

            {}

        )


