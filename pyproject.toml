# GEDT AUTONOMOUS SYSTEM
# =============================

class GEDT:


    def __init__(self,asset):


        self.twin=DigitalTwin(asset)

        self.ai=IntelligenceEngine()

        self.safety=SafetyController()

        self.actuator=Actuator()

        self.memory=FeedbackMemory()



    def run(self,sensor):


        self.twin.update(sensor)



        decision=self.ai.analyze(

            sensor

        )


        approved=self.safety.approve(

            decision

        )


        if approved:


            result=self.actuator.execute(

                decision["action"],

                sensor

            )


        else:

            result=sensor



        feedback={


        "time":

        str(datetime.now()),


        "before":

        sensor,


        "decision":

        decision,


        "approved":

        approved,


        "after":

        result

        }



        self.memory.store(

            feedback

        )


        return feedback




