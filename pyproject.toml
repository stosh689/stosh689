"""
============================================================
GEDT v12 Request Router

Routes requests to registered services.

============================================================
"""


class RequestRouter:


    def __init__(
        self,
        registry
    ):

        self.registry=registry



    def route(
        self,
        service,
        payload
    ):


        target=self.registry.get(

            service

        )



        if not target:


            return {


                "status":

                "service_not_found"

            }



        return {


            "service":

            service,


            "endpoint":

            target["endpoint"],


            "payload":

            payload,


            "status":

            "routed"

        }



