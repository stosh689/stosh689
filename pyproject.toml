"""

import random

from datetime import datetime



class QuantumInspiredOptimizer:


    def __init__(self):

        self.history=[]



    def generate_candidates(
        self,
        size=10
    ):


        candidates=[]


        for _ in range(size):


            candidates.append(

                {

                "solution":

                random.random(),


                "score":

                random.random()

                }

            )


        return candidates



    def optimize(
        self,
        objective
    ):


        candidates=self.generate_candidates()



        best=max(

