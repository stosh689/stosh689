"""
============================================================
GEDT v12 Knowledge Graph

Stores entities and relationships.

============================================================
"""

from datetime import datetime



class KnowledgeGraph:


    def __init__(self):

        self.entities={}

        self.relationships=[]



    def add_entity(
        self,
        name,
        data
    ):


        self.entities[name]={


            "data":

            data,


            "created":

            datetime.utcnow()
            .isoformat()

        }



    def add_relationship(
        self,
        source,
        relation,
        target
    ):


        self.relationships.append(

            {

            "source":

            source,


            "relation":

            relation,


            "target":

            target

            }

        )



    def query(
        self,
        entity
    ):


        return {


            "entity":

            self.entities.get(

                entity

            ),


            "relationships":

            [

            r for r in self.relationships

            if r["source"]==entity

            ]

        }



