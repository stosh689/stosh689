                )

            )


        decision=self.optimizer.select(

            futures

        )


        report={


        "asset":

        self.twin.asset,


        "time":

        str(datetime.now()),


        "risk":

        risk,


        "status":

        status,


        "decision":

        decision


        }


        self.memory.store(report)


        return report




