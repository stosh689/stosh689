import numpy as np



class AIMetrics:


    def mse(
        self,
        actual,
        predicted
    ):

        return float(

            np.mean(

                (
                    np.array(actual)

                    -

                    np.array(predicted)

                ) ** 2

            )

        )



    def accuracy(
        self,
        actual,
        predicted
    ):

        return float(

            np.mean(

                np.array(actual)

                ==

                np.array(predicted)

            )

        )


