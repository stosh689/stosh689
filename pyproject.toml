"""
GEDT Health Monitoring System

Provides:
- Component health checks
- Service status
- Readiness checks
- Runtime diagnostics
"""

from dataclasses import dataclass, field
from datetime import datetime
from typing import Dict, List


@dataclass
class HealthStatus:

    component: str

    healthy: bool

    message: str

    timestamp: str = field(
        default_factory=lambda:
        datetime.utcnow().isoformat()
    )



class HealthMonitor:


    def __init__(self):

        self.components = {}



    def register_component(

        self,

        name: str,

        check_function

    ):

        self.components[name] = check_function



    def check_component(

        self,

        name: str

    ) -> HealthStatus:


        if name not in self.components:

            return HealthStatus(

                name,

                False,

                "Component not registered"

            )


        try:

            result = self.components[name]()


            return HealthStatus(

                name,

                True,

                result

            )


        except Exception as error:


            return HealthStatus(

                name,

                False,

                str(error)

            )



    def check_all(self) -> List[Dict]:

        results = []


        for component in self.components:

            status = self.check_component(

                component

            )

            results.append(

                status.__dict__

            )


        return results



    def system_status(self):

        results = self.check_all()


        healthy = all(

            item["healthy"]

            for item in results

        )


        return {

            "system":

            "GEDT",


            "healthy":

            healthy,


            "timestamp":

            datetime.utcnow().isoformat(),


            "components":

            results

        }




