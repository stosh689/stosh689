"""
GEDT Depth Evaluation
"""


def depth_error(

    prediction,

    ground_truth

):


    errors = []


    for p,g in zip(

        prediction,

        ground_truth

    ):

        errors.append(

            abs(p-g)

        )


    return {


        "mean_absolute_error":

        sum(errors)/len(errors)

    }

