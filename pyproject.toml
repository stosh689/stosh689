"""
GEDT Data Lineage Graph
"""


class LineageGraph:


    def __init__(self):

        self.links = []



    def add_link(

        self,

        parent,

        child

    ):

        self.links.append(

            {

            "parent":

            parent,


            "child":

            child

            }

        )



    def trace(

        self,

        item

    ):

        return [

            link

            for link

            in self.links

            if link["child"] == item

