GEDT v12 Schema Registry

Maintains data structure definitions.

============================================================
"""


class SchemaRegistry:


    def __init__(self):

        self.schemas={}



    def register(
        self,
        name,
        fields
    ):


        self.schemas[name]={


            "fields":

            fields

        }



    def validate(
        self,
        name,
        data
    ):


        schema=self.schemas.get(

            name

        )


        if not schema:

            return False



        return all(

            field in data

            for field in schema["fields"]

        )



if __name__=="__main__":


    registry=SchemaRegistry()



    registry.register(

        "sensor",

        [

        "id",

        "value"

        ]

    )



    print(

        registry.validate(

            "sensor",

            {

            "id":1,

            "value":10

            }

        )

    )



