from datetime import datetime



class FederatedClient:


    def __init__(
        self,
        client_id
    ):

        self.client_id=client_id

        self.model={}



    def train(
        self,
        data
    ):


        update={


            "client":

            self.client_id,


            "weights":

            {

            "feature_1":

            len(data)*0.01,


            "feature_2":

            len(data)*0.02

            },


            "timestamp":

