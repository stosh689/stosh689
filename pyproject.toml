class Predictor:


    def predict(self,state):

        risk=(

        state["temperature"]*0.005

        +

        state["vibration"]*0.05

        )


        return round(

            min(risk,1),

            3

        )



class AgentSystem:


    def analyze(self,risk):


        if risk>0.75:

            return "Critical"


        elif risk>0.45:

            return "Warning"


        return "Normal"



class WorldModel:


    def simulate(self,state,action):


        temperature=state["temperature"]


        if action=="Maintenance":

            temperature-=15


        elif action=="Reduce Load":

            temperature-=8


        else:

            temperature+=10



        risk=min(

            temperature*0.005,

            1

        )


        return {

        "action":action,

        "future_risk":

        round(risk,3)

        }



class Optimizer:


    def select(self,scenarios):


        return min(

            scenarios,

            key=lambda x:

            x["future_risk"]

        )



class Memory:


    def __init__(self):

        self.records=[]



    def store(self,data):

        self.records.append(data)



class GEDT:


    def __init__(self,asset):


        self.twin=DigitalTwin(asset)

        self.predictor=Predictor()

        self.agent=AgentSystem()

        self.world=WorldModel()

        self.optimizer=Optimizer()

        self.memory=Memory()



