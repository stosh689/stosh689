"""
GEDT Scenario Generator
"""

import random

from app.simulation.scenario import Scenario


class ScenarioGenerator:
    """
    Creates possible future scenarios.
    """

    def generate(
        self,
        count: int = 10
    ):

        scenarios = []

        for i in range(count):

            scenarios.append(

                Scenario(

                    name=f"scenario_{i}",

                    resource_change=random.uniform(
                        -10000,
                        20000
                    ),

                    demand_change=random.uniform(
                        -0.2,
                        0.3
                    ),

                    risk_change=random.uniform(
                        -0.1,
                        0.2
                    )

                )

            )

        return scenarios


"""
GEDT Monte Carlo Simulation
"""

from app.simulation.engine import SimulationEngine
from app.simulation.metrics import calculate_score


class MonteCarloSimulator:


    def __init__(self):

        self.engine = SimulationEngine()



    def run(

        self,

        state,

        scenarios

    ):

        results = []


        for scenario in scenarios:

            outcome = self.engine.run(

                state,

                scenario

            )


            outcome["score"] = calculate_score(

                outcome["resources"],

                outcome["demand"],

                outcome["risk"]

            )


            outcome["scenario"] = scenario.name


            results.append(

                outcome

            )


        return results

"""
GEDT Decision Evaluation
"""


class DecisionEvaluator:


    def rank(

        self,

        results

    ):

        return sorted(

            results,

            key=lambda x:

            x["score"],

            reverse=True

        )

"""
GEDT Simulation Reports
"""


class SimulationReport:


    def summarize(

        self,

        results

    ):


        scores = [

            r["score"]

            for r in results

        ]


        return {

            "scenarios":

            len(results),


            "best_score":

            max(scores),


            "average_score":

            sum(scores) / len(scores)

        }


from app.simulation.scenario_generator import ScenarioGenerator

from app.simulation.monte_carlo import MonteCarloSimulator

from app.simulation.evaluator import DecisionEvaluator

from app.simulation.report import SimulationReport


@router.post("/monte-carlo")
def monte_carlo():


    state = DigitalTwinState(

        population=100000,

        resources=50000,

        demand=45000,

        risk_level=0.2

    )


    generator = ScenarioGenerator()

    scenarios = generator.generate(100)


    simulator = MonteCarloSimulator()

    results = simulator.run(

        state,

        scenarios

    )


    evaluator = DecisionEvaluator()

    ranked = evaluator.rank(

        results

    )


    report = SimulationReport()

    return {

        "recommendation":

        ranked[0],


        "summary":

        report.summarize(

            results

        )

    }


