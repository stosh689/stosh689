"""
============================================================
GEDT v11 Release Builder

Creates production release archive.

============================================================
"""

import os
import shutil

from datetime import datetime



VERSION="11.0.0"



def build_release():


    package=f"GEDT-v{VERSION}"



    if os.path.exists(package):

        shutil.rmtree(package)



    os.makedirs(package)



    files=[

        "gedt.py",

        "requirements.txt",

        "README.md",

        "Dockerfile",

        "docker-compose.yml"

    ]



    for file in files:


        if os.path.exists(file):

            shutil.copy(

                file,

                package

            )



    shutil.make_archive(

        package,

        "zip",

        package

    )



    return {


        "package":

        package+".zip",


        "created":

        datetime.utcnow()
        .isoformat()

    }



if __name__=="__main__":


    print(

        build_release()

    )



"""
============================================================
GEDT Release Checksum Generator

============================================================
"""

import hashlib



def checksum(filename):


    sha256=hashlib.sha256()



    with open(
        filename,
        "rb"
    ) as file:


        for block in iter(

            lambda:

            file.read(4096),

            b""

        ):

            sha256.update(block)



    return sha256.hexdigest()



if __name__=="__main__":


    package="GEDT-v11.0.0.zip"



    print(

        checksum(package)

    )


